services:
  - type: web
    name: battlecity
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Leaderboard (Supabase "chicken horde leaderboard" project, table battlecity_scores).
      # The publishable key is public by design; RLS only allows reading and inserting scores.
      - key: SUPABASE_URL
        value: https://vjbcqhkfvctzwecmzcqa.supabase.co
      - key: SUPABASE_KEY
        value: sb_publishable_mJlZ7Ym9LXAhTkWncksX6A_Czg0mbv6
